[project]
name = "beauty-recommender"
version = "0.1.0"
description = "Explainable hybrid skincare recommendation system"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules", ".next", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Typecheck the source-of-truth packages. The backend/ tree is checked separately
# (sibling imports + a copied engine/ package confuse a single mypy run).
files = ["engine", "src", "tests"]
mypy_path = "."
exclude = ["node_modules", "\\.next", "data", "backend"]
explicit_package_bases = true

[tool.ruff.lint.per-file-ignores]
"src/audit/run_audit.py" = ["E501", "RUF001"]
"tests/test_preprocessing.py" = ["E501"]
"backend/main.py" = ["E402", "I001"]
"backend/recommend_service.py" = ["I001"]

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "recommend_service", "schemas", "backend.recommend_service", "backend.schemas"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backend.main"]
disable_error_code = ["import-not-found", "no-any-return"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
