[project]
name = "beauty-recommender"
version = "0.1.0"
description = "Explainable hybrid skincare recommendation system"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules", ".next", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["node_modules", "\\.next", "data"]
# api/ has no __init__.py on purpose: Vercel's file-based routing treats every
# .py file under api/ as a function entrypoint. Resolve modules from the repo
# root instead so api/index.py is seen only as "api.index".
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
