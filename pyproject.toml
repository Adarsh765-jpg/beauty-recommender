[project]
name = "beauty-recommender"
version = "0.1.0"
description = "Explainable hybrid skincare recommendation system"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules", ".next", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["node_modules", "\\.next", "data"]
mypy_path = "."
explicit_package_bases = true
[tool.ruff.lint.per-file-ignores]
"src/audit/run_audit.py" = ["E501", "RUF001"]
"tests/test_preprocessing.py" = ["E501"]
"backend/main.py" = ["E402", "I001"]
"backend/recommend_service.py" = ["I001"]

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
